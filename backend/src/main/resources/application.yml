spring:
  application:
    name: gestion-bodega-backend

  # ─── MySQL 8 / MariaDB ───
  # Variables sensibles via env vars (con defaults para desarrollo local)
  datasource:
    # allowPublicKeyRetrieval + useSsl=false permiten al driver MariaDB
    # autenticarse contra MySQL 8 con caching_sha2_password sin canal TLS
    # (obligatorio en desarrollo local).
    url: ${DB_URL:jdbc:mariadb://localhost:3306/gestion_bodega?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useSsl=false}
    username: ${DB_USER:bodega_user}
    password: ${DB_PASS:bodega_pass}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ─── JPA / Hibernate ───
  jpa:
    hibernate:
      ddl-auto: validate          # NUNCA usar 'create' o 'update' — Flyway maneja el schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        jdbc:
          time_zone: America/Lima
    open-in-view: false

  # ─── Flyway (migraciones) ───
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ─── Jackson (JSON) ───
  jackson:
    time-zone: America/Lima
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: NON_NULL

# ─── Server ───
server:
  port: 8080
  servlet:
    context-path: /api

# ─── App config (JWT, Flyway extras, CORS) ───
app:
  jwt:
    # Variable de entorno obligatoria en produccion. Default solo para dev local.
    # Debe tener minimo 256 bits (32 chars).
    secret: ${JWT_SECRET:dev_secret_local_no_usar_en_produccion_minimo_32}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}      # 8 horas
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  # Flyway extras (la propiedad spring.flyway.repair-on-migrate NO existe en
  # Spring Boot Community, asi que se implementa en FlywayConfig.java).
  flyway:
    repair-on-startup: ${FLYWAY_REPAIR:true}

# ─── Integracion con FinantialTracker (sistema de planilla del HSJ) ───
# Segundo DataSource que apunta a la BD de FT para pushear la deuda mensual
# al cerrar el mes. Si enabled=false, los endpoints devuelven 503 sin tocar
# la BD (util para dev sin FT corriendo).
integracion:
  financialtracker:
    enabled: ${FT_ENABLED:true}
    url: ${FT_DB_URL:jdbc:mariadb://localhost:3306/financialtracker1?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=America/Lima&allowPublicKeyRetrieval=true&useSsl=false}
    user: ${FT_DB_USER:root}
    # Default de desarrollo local (mismo criterio que los defaults de la BD
    # bodega arriba). En produccion SIEMPRE definir FT_DB_PASS por variable
    # de entorno.
    password: ${FT_DB_PASS:123456}
    # ID del service_concept en FT que representa "Consumo en bodega".
    # Karina debe verificar/crear este concepto en la UI de FT y ajustar aqui.
    service-concept-id: ${FT_SERVICE_CONCEPT_ID:1}
    # Dia del mes siguiente en que se descuenta el abono.
    dia-descuento: ${FT_DIA_DESCUENTO:5}

# ─── Swagger ───
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ─── Logging ───
logging:
  level:
    root: INFO
    com.thiago.gestionbodega: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO
