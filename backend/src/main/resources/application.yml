spring:
  application:
    name: gestion-bodega-backend

  # ─── MySQL ───
  # El backend se conecta a la MISMA base de datos que FinantialTracker
  # (contenedor docker "mysql-proyectos", ver ~/Desktop/me/mysql-db).
  # Variables sensibles via env vars (con defaults para desarrollo local).
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/financialtracker1?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=America/Lima&forceConnectionTimeZoneToSession=true}"
    username: ${DB_USER:root}
    password: ${DB_PASS:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ─── JPA / Hibernate ───
  jpa:
    hibernate:
      ddl-auto: validate          # NUNCA usar 'create' o 'update' — Flyway maneja el schema
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: America/Lima
        timezone:
          # MySQL no guarda zona horaria: las fechas se normalizan a America/Lima
          # (misma zona que la sesion JDBC, ver connectionTimeZone en la URL).
          default_storage: NORMALIZE
        type:
          preferred_uuid_jdbc_type: CHAR   # UUID se guarda como CHAR(36) en MySQL
    open-in-view: false

  # ─── Flyway (migraciones) ───
  flyway:
    enabled: true
    locations: classpath:db/migration
    # La BD ya tiene tablas de FinantialTracker: se crea la linea base en la
    # version 0 para que V1, V2, ... se apliquen completas.
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # ─── Jackson (JSON) ───
  jackson:
    time-zone: America/Lima
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: NON_NULL

# ─── Server ───
server:
  port: 8080
  servlet:
    context-path: /api

# ─── App config (JWT, Flyway extras, CORS) ───
app:
  jwt:
    # Variable de entorno obligatoria en produccion. Default solo para dev local.
    # Debe tener minimo 256 bits (32 chars).
    secret: ${JWT_SECRET:dev_secret_local_no_usar_en_produccion_minimo_32}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000}      # 8 horas
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  # Flyway extras (la propiedad spring.flyway.repair-on-migrate NO existe en
  # Spring Boot Community, asi que se implementa en FlywayConfig.java).
  flyway:
    repair-on-startup: ${FLYWAY_REPAIR:true}

# ─── Swagger ───
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ─── Logging ───
logging:
  level:
    root: INFO
    com.thiago.gestionbodega: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO
